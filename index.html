<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>のぞみの共有ページ</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Yu Gothic", sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 30px 15px;
    }

    .box {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      font-size: 26px;
    }

    .description {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .item {
      margin-top: 20px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 16px;
      text-align: center;
    }

    .item h2 {
      font-size: 17px;
      word-break: break-all;
      margin-top: 0;
    }

    .preview {
      width: 100%;
      max-width: 650px;
      max-height: 500px;
      object-fit: contain;
      border-radius: 12px;
      display: block;
      margin: 15px auto;
      background: white;
    }

    .download {
      display: inline-block;
      margin-top: 10px;
      padding: 13px 22px;
      background: #333;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
    }

    .download:hover {
      opacity: 0.8;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 30px;
    }

    .error {
      text-align: center;
      color: #d33;
      padding: 20px;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>📁 のぞみの共有ページ</h1>

    <p class="description">
      GitHubに追加したファイルが自動的に表示されます。
    </p>

    <div id="files">
      <div class="loading">
        📂 ファイルを読み込んでいます……
      </div>
    </div>

  </div>


<script>

  // GitHubのリポジトリ
  const owner = "nozomichan113";
  const repo = "nozomipia";
  const branch = "main";


  // GitHubからファイル一覧を取得
  async function loadFiles() {

    const container = document.getElementById("files");

    try {

      const apiUrl =
        `https://api.github.com/repos/${owner}/${repo}/contents/?ref=${branch}`;

      const response = await fetch(apiUrl);

      if (!response.ok) {
        throw new Error("GitHubからファイルを取得できませんでした。");
      }

      const files = await response.json();


      // index.html自身は表示しない
      const displayFiles = files
        .filter(file => file.name !== "index.html")
        .filter(file => file.type === "file");


      // 名前順に並べる
      displayFiles.sort((a, b) =>
        a.name.localeCompare(b.name, "ja")
      );


      container.innerHTML = "";


      if (displayFiles.length === 0) {

        container.innerHTML =
          `<div class="loading">まだファイルがありません。</div>`;

        return;
      }


      // ファイルを1つずつ表示
      displayFiles.forEach(file => {

        const item = document.createElement("div");
        item.className = "item";


        const title = document.createElement("h2");
        title.textContent = file.name;

        item.appendChild(title);


        // 画像の場合
        if (isImage(file.name)) {

          const img = document.createElement("img");

          img.className = "preview";
          img.src = file.download_url;
          img.alt = file.name;

          item.appendChild(img);
        }


        // ダウンロードボタン
        const link = document.createElement("a");

        link.className = "download";
        link.href = file.download_url;
        link.target = "_blank";
        link.rel = "noopener";

        if (isImage(file.name)) {
          link.textContent = "📥 この画像を開く・保存";
        } else {
          link.textContent = "📥 このファイルをダウンロード";
        }

        item.appendChild(link);


        container.appendChild(item);

      });

    }

    catch (error) {

      container.innerHTML = `
        <div class="error">
          ⚠️ ファイルを読み込めませんでした。<br><br>
          ページを再読み込みしてください。
        </div>
      `;

      console.error(error);
    }

  }


  // 画像かどうか判定
  function isImage(filename) {

    const extensions = [
      ".png",
      ".jpg",
      ".jpeg",
      ".gif",
      ".webp"
    ];

    return extensions.some(ext =>
      filename.toLowerCase().endsWith(ext)
    );

  }


  // 実行
  loadFiles();

</script>

</body>
</html>
