
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファイル共有ページ</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: sans-serif;
  background: #f4f7fb;
  color: #333;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 750px;
  margin: auto;
}

h1 {
  text-align: center;
  color: #315f91;
  margin-bottom: 25px;
}

.upload-area {
  background: white;
  padding: 22px;
  border-radius: 14px;
  text-align: center;
  margin-bottom: 25px;
}

.upload-button {
  display: inline-block;
  background: #315f91;
  color: white;
  padding: 12px 22px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

h2 {
  font-size: 18px;
  color: #315f91;
  margin-bottom: 15px;
}

.file {
  background: white;
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.file-info {
  min-width: 0;
  overflow-wrap: anywhere;
}

.file-info a {
  color: #315f91;
  text-decoration: none;
  font-weight: bold;
}

.file img {
  display: block;
  max-width: 100%;
  max-height: 180px;
  margin-top: 10px;
  border-radius: 8px;
}

.delete-button {
  background: #fff0f0;
  color: #d64545;
  border: 1px solid #e8aaaa;
  padding: 8px 12px;
  border-radius: 7px;
  text-decoration: none;
  white-space: nowrap;
  font-size: 13px;
}

.refresh {
  display: block;
  margin: 15px auto;
  padding: 10px 18px;
  border: none;
  border-radius: 8px;
  background: #e4edf8;
  color: #315f91;
  font-size: 14px;
}

</style>
</head>

<body>
<div class="container">

<h1>ファイル共有ページ</h1>

<div class="upload-area">
  <h2>ファイルを追加</h2>
  <p>新しいファイルはこちらから追加できます。</p>
  <a class="upload-button"
     href="https://github.com/nozomichan113/nozomipia/upload/main"
     target="_blank">
    ＋ ファイルをアップロード
  </a>
</div>

<h2>ファイル一覧</h2>

<button class="refresh" onclick="loadFiles()">
  ↻ 一覧を更新
</button>

<div id="files">読み込み中...</div>

</div>

<script>
const owner = "nozomichan113";
const repo = "nozomipia";

async function loadFiles() {
  const area = document.getElementById("files");
  area.textContent = "読み込み中...";

  try {
    const response = await fetch(
      `https://api.github.com/repos/${owner}/${repo}/contents/?ref=main`
    );

    if (!response.ok) throw new Error();

    const files = await response.json();
    area.innerHTML = "";

    files
      .filter(file => file.name !== "index.html")
      .forEach(file => {

        const item = document.createElement("div");
        item.className = "file";

        const info = document.createElement("div");
        info.className = "file-info";

        const link = document.createElement("a");
        link.href = file.html_url;
        link.target = "_blank";
        link.textContent = file.name;
        info.appendChild(link);

        if (/\.(png|jpg|jpeg|gif|webp)$/i.test(file.name)) {
          const img = document.createElement("img");
          img.src = file.download_url;
          img.alt = file.name;
          info.appendChild(img);
        }

        const del = document.createElement("a");
        del.className = "delete-button";
        del.textContent = "削除";
        del.href =
          `https://github.com/${owner}/${repo}/delete/main/${encodeURIComponent(file.name)}`;
        del.target = "_blank";

        item.appendChild(info);
        item.appendChild(del);
        area.appendChild(item);
      });

    if (files.filter(f => f.name !== "index.html").length === 0) {
      area.textContent = "ファイルはありません。";
    }

  } catch (error) {
    area.textContent = "ファイルを読み込めませんでした。";
  }
}

loadFiles();
</script>

</body>
</html>
