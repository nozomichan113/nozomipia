
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ファイル共有ページ</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  font-family: sans-serif;
  background: #f4f7fb;
  color: #333;
  margin: 0;
  padding: 20px;
}

.container {
  max-width: 750px;
  margin: auto;
}

h1 {
  color: #315f91;
  text-align: center;
}

.upload-area {
  background: white;
  border-radius: 14px;
  padding: 24px;
  text-align: center;
  margin: 24px 0;
}

.upload-button {
  display: inline-block;
  background: #315f91;
  color: white;
  padding: 13px 24px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

#fileInput { display: none; }

#status {
  text-align: center;
  margin: 12px 0;
  color: #315f91;
  font-size: 14px;
}

.file {
  background: white;
  padding: 15px;
  border-radius: 10px;
  margin: 12px 0;
  display: flex;
  align-items: center;
  gap: 12px;
}

.file-info {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}

.file-info a {
  color: #315f91;
  text-decoration: none;
  font-weight: bold;
}

.file img {
  display: block;
  max-width: 100%;
  max-height: 160px;
  margin-top: 10px;
  border-radius: 8px;
}

.download {
  color: #315f91;
  text-decoration: none;
  padding: 8px;
}

.delete {
  border: 0;
  background: #fff0f0;
  color: #d64545;
  padding: 9px 12px;
  border-radius: 7px;
  cursor: pointer;
  white-space: nowrap;
}

.refresh {
  display: block;
  margin: 15px auto;
  padding: 10px 18px;
  border: 0;
  border-radius: 8px;
  background: #e4edf8;
  color: #315f91;
}

</style>
</head>

<body>
<div class="container">

<h1>ファイル共有ページ</h1>

<div class="upload-area">
  <h3>ファイルを追加</h3>
  <p>スマホ・パソコンからファイルを添付できます。</p>

  <label class="upload-button" for="fileInput">
    ＋ ファイルを選択
  </label>

  <input type="file" id="fileInput" multiple>
  <div id="status"></div>
</div>

<h3>ファイル一覧</h3>

<button class="refresh" onclick="loadFiles()">
  ↻ 一覧を更新
</button>

<div id="files">読み込み中...</div>

</div>

<script>
const SUPABASE_URL =
  "https://yigllagzbkrcchwdxgcum.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlpZ2xsYWd6YmtyY2h3ZHhnY3VtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2Nzk5NTMsImV4cCI6MjEwOTI1NTk1M30.O71yOOGpx6vKTBlRrNWquq7Dac263pOMSojws6REMAE";

const BUCKET = "shared-files";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const status = document.getElementById("status");
const area = document.getElementById("files");
const input = document.getElementById("fileInput");

async function loadFiles() {
  area.textContent = "読み込み中...";

  const { data, error } = await db.storage
    .from(BUCKET)
    .list("", {
      limit: 100,
      sortBy: { column: "name", order: "asc" }
    });

  if (error) {
    area.textContent = "読み込みエラー：" + error.message;
    return;
  }

  area.innerHTML = "";

  const files = data.filter(file => file.id !== null);

  if (files.length === 0) {
    area.textContent = "ファイルはありません。";
    return;
  }

  files.forEach(file => {
    const publicResult = db.storage
      .from(BUCKET)
      .getPublicUrl(file.name);

    const url = publicResult.data.publicUrl;

    const item = document.createElement("div");
    item.className = "file";

    const info = document.createElement("div");
    info.className = "file-info";

    const link = document.createElement("a");
    link.href = url;
    link.target = "_blank";
    link.textContent = file.name;

    info.appendChild(link);

    if (/\.(png|jpg|jpeg|gif|webp)$/i.test(file.name)) {
      const img = document.createElement("img");
      img.src = url;
      img.alt = file.name;
      info.appendChild(img);
    }

    const download = document.createElement("a");
    download.href = url;
    download.download = file.name;
    download.className = "download";
    download.textContent = "↓";

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "削除";

    del.onclick = async () => {
      if (!confirm(
        "「" + file.name + "」を削除しますか？"
      )) return;

      del.disabled = true;
      del.textContent = "削除中...";

      const { error } = await db.storage
        .from(BUCKET)
        .remove([file.name]);

      if (error) {
        alert("削除できませんでした：" + error.message);
        del.disabled = false;
        del.textContent = "削除";
        return;
      }

      await loadFiles();
    };

    item.appendChild(info);
    item.appendChild(download);
    item.appendChild(del);

    area.appendChild(item);
  });
}

input.addEventListener("change", async () => {
  const selected = Array.from(input.files);

  if (selected.length === 0) return;

  for (const file of selected) {
    status.textContent = file.name + " をアップロード中...";

    const { error } = await db.storage
      .from(BUCKET)
      .upload(file.name, file, {
        upsert: false
      });

    if (error) {
      alert(file.name + "：アップロード失敗\n" + error.message);
    }
  }

  status.textContent = "アップロード処理が終了しました。";
  input.value = "";
  await loadFiles();
});

loadFiles();
</script>

</body>
</html>
