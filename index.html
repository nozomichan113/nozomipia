<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>東海大冒険 イラスト素材</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Yu Gothic", sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 30px 15px;
      text-align: center;
    }

    .box {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
      font-size: 26px;
    }

    .item {
      margin-top: 30px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 16px;
    }

    .item h2 {
      font-size: 18px;
      margin-top: 0;
    }

    .preview {
      width: 100%;
      max-width: 600px;
      height: auto;
      border-radius: 12px;
      display: block;
      margin: 15px auto;
    }

    .download {
      display: inline-block;
      margin-top: 10px;
      padding: 14px 24px;
      background: #333;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    .download:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🎨 東海大冒険 イラスト素材</h1>

    <p>必要な画像をタップしてダウンロードできます。</p>


    <!-- 画像① -->
    <div class="item">

      <h2>① タイトルロゴ・東海大冒険</h2>

      <img
        class="preview"
        src="4F959904-D24C-4589-9D5E-88AC2DD0ABCC.png"
        alt="東海大冒険 タイトルロゴ"
      >

      <a
        class="download"
        href="4F959904-D24C-4589-9D5E-88AC2DD0ABCC.png"
        download
      >
        📥 この画像をダウンロード
      </a>

    </div>


    <!-- 画像② -->
    <div class="item">

      <h2>② 東海地方イラスト素材</h2>

      <img
        class="preview"
        src="A6B011BB-260A-407C-B771-AC3A4A6A5930.png"
        alt="東海地方イラスト素材"
      >

      <a
        class="download"
        href="A6B011BB-260A-407C-B771-AC3A4A6A5930.png"
        download
      >
        📥 この画像をダウンロード
      </a>

    </div>

  </div>

</body>
</html>
